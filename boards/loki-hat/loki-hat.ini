; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html
;
; Loki HAT - ESP32-S3 coprocessor board for Project Loki.
; Pin definitions live in boards/loki-hat/pins_arduino.h (source of truth:
; hardware/PINOUT.md in the Loki repo). Board JSON:
; boards/_boards_json/loki-hat.json.
;
; HEADLESS BOARD: there is no display on the ESP32 - the screen lives on the
; Pi side of the HAT. The Pi drives this board over hardware UART0
; (IO43/IO44) using the Pi<->ESP32 serial protocol. USB is reserved for
; BadUSB HID and flashing only (Loki decision D10), so
; ARDUINO_USB_CDC_ON_BOOT is intentionally NOT enabled - do not turn it on,
; it would fight BadUSB for the USB peripheral.

[env:loki-hat]
board = loki-hat
board_build.arduino.memory_type = qio_opi  ; NEEDED FOR 8MB PSRAM (N16R8)
board_build.partitions = custom_16Mb.csv   ; TODO: confirm at first build that Bruce ships custom_16Mb.csv and that its layout suits Loki (ESP-General references it; the _boards_json default is default_16MB.csv)
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
monitor_speed = 115200
build_src_filter = ${env.build_src_filter} +<../boards/loki-hat>
build_flags =
	${env.build_flags}
	-Iboards/loki-hat
	-Os
	-DCORE_DEBUG_LEVEL=5
	-DBOARD_HAS_PSRAM=1
	-DUSB_as_HID=1
	;-DARDUINO_USB_CDC_ON_BOOT=1  ; DO NOT ENABLE (decision D10): Pi link is hardware UART0, USB is BadUSB/flashing only

lib_deps =
	${env.lib_deps}
	xylopyrographer/LiteLED@^1.2.0
